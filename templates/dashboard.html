<!DOCTYPE html>
<html>
<head>
    <title>Sleep Quality Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body>

<div class="dashboard-container">
    <div class="glass-card">
        <div class="dashboard-header">
            <div>
                <h1 class="title-box" style="margin-bottom: 10px;">Sleep Quality Dashboard</h1>
                <p class="welcome-text">Welcome back, {{ user }}!</p>
            </div>
            <a href="/logout" class="logout-btn">Logout</a>
        </div>

        {% if dates and dates|length > 0 %}
        <div class="chart-container">
            <canvas id="sleepChart" height="100"></canvas>
        </div>
        {% else %}
        <div class="action-section">
            <div class="icon" style="font-size: 64px; margin-bottom: 20px;">📊</div>
            <h3>No Sleep Records Yet</h3>
            <p style="color: #64748b; margin: 16px 0;">Start tracking your sleep quality to see your progress over time.</p>
        </div>
        {% endif %}

        <div class="text-center mt-4">
            <a href="/" class="btn-3d">
                ← Back to Analyzer
            </a>
        </div>
    </div>
</div>

<script>
var dates = {{ dates | tojson }};
var scores = {{ scores | tojson }};

if(dates.length === 0){
    document.getElementById("sleepChart").outerHTML =
    "<div class='text-center py-5'><h4>No sleep records found.</h4></div>";
}else{
    new Chart(document.getElementById("sleepChart"),{
        type:"line",
        data:{
            labels:dates,
            datasets:[{
                label:"Sleep Score",
                data:scores,
                borderColor:"#6366f1",
                backgroundColor:"rgba(99, 102, 241, 0.1)",
                fill:true,
                tension:0.4,
                pointBackgroundColor:"#6366f1",
                pointBorderColor:"white",
                pointBorderWidth:2,
                pointRadius:5,
                pointHoverRadius:7
            }]
        },
        options:{
            responsive:true,
            plugins:{
                legend:{display:true, position:'top'}
            },
            scales:{
                y:{
                    min:0,
                    max:100,
                    grid:{color:"rgba(0,0,0,0.05)"}
                },
                x:{
                    grid:{display:false}
                }
            }
        }
    });
}
</script>

</body>
</html>
